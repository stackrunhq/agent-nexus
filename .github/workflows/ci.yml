name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e '.[dev]' -c requirements.lock
      - run: python -m pytest -q
      - run: python -m ruff check --config pyproject.toml src tests
      - run: node --check src/agent_nexus/static/admin.js
      - run: docker build -t agent-nexus:test .
