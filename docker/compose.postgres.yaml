services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "agent_nexus.db_cli", "upgrade"]
    environment:
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?Set PostgreSQL URL using host postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    environment:
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?Set PostgreSQL URL using host postgres}
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    environment:
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?Set PostgreSQL URL using host postgres}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
