services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEXUS_ADMIN_TOKEN: ${NEXUS_ADMIN_TOKEN:?Set NEXUS_ADMIN_TOKEN in .env}
      NEXUS_CLIENT_TOKEN: ${NEXUS_CLIENT_TOKEN:-}
      NEXUS_AUTH_MODE: ${NEXUS_AUTH_MODE:-bootstrap}
      NEXUS_INDEX_DAILY_LIMIT: ${NEXUS_INDEX_DAILY_LIMIT:-100}
      NEXUS_INDEX_SCHEDULER: ${NEXUS_INDEX_SCHEDULER:-fifo}
      NEXUS_MODEL_DAILY_LIMIT: ${NEXUS_MODEL_DAILY_LIMIT:-1000}
      NEXUS_ALLOWED_HOSTS: ${NEXUS_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal}
      NEXUS_DATABASE_PATH: /app/data/nexus.db
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:-}
      NEXUS_PROVIDER_CLOUD_KEY: ${NEXUS_PROVIDER_CLOUD_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "agent_nexus_cli.worker"]
    environment:
      NEXUS_DATABASE_PATH: /app/data/nexus.db
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:-}
    volumes:
      - nexus-data:/app/data
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
  index-worker:
    extends:
      service: worker
    command: ["python", "-m", "agent_nexus_cli.worker", "--queue", "indexes"]
    environment:
      NEXUS_INDEX_SCHEDULER: ${NEXUS_INDEX_SCHEDULER:-fifo}
      NEXUS_MODEL_DAILY_LIMIT: ${NEXUS_MODEL_DAILY_LIMIT:-1000}
      NEXUS_ALLOWED_HOSTS: ${NEXUS_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal}
      NEXUS_PROVIDER_CLOUD_KEY: ${NEXUS_PROVIDER_CLOUD_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  nexus-data:
