[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-nexus"
version = "0.3.0"
description = "Enterprise knowledge and workflow middleware: model gateway foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4"]

[project.scripts]
nexus-db = "agent_nexus_cli.database:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["api/src", "cli/src", "web/src"]
namespaces = false

[tool.setuptools.package-data]
agent_nexus_web = ["static/*.html", "static/*.css", "static/*.js", "static/tenants/*.html", "static/tenants/assets/*.css", "static/tenants/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM"]
